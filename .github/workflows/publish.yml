name: Publish to PyPI

# Publishing is intentionally NOT triggered by pushes to main.
# Only publishing a GitHub Release can upload a package to PyPI.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: sl-guard-pypi-publication
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check release tag against package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match package version {version!r}. "
                  f"Use tag {expected!r} and check 'Set as a pre-release' if desired."
              )
          print(f"Version check passed: {version}")
          PY

      - name: Install testing and packaging tools
        run: python -m pip install --upgrade pip pytest build twine

      - name: Run Python tests
        run: python -m pytest -q tests

      - name: Run JavaScript tests
        run: node --test tests/js/*.test.mjs

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/inventree-sl-guard
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
